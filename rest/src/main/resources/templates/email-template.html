<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Correo de Bienvenida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        p { color: #555555; line-height: 1.6; }
        .footer { margin-top: 20px; font-size: 12px; color: #888888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Hola, <span th:text="${nombre}">Usuario</span>!</h1>
        <p>Este es un correo enviado desde mi <strong>API REST con Spring Boot</strong>.</p>
        <p>Si estás viendo este mensaje, significa que el servicio de correo y la plantilla de Thymeleaf están funcionando correctamente.</p>
        <div class="footer">
            <p>Tarea de Jose Luis Sanchez - 2026</p>
        </div>
    </div>
</body>
</html>
